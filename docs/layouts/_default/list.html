{{ define "header" }}
  <header class="portfolio-topbar">
    {{ partials.Include "site-navigation.html" . }}
  </header>
{{ end }}

{{ define "main" }}
  <section class="portfolio-section portfolio-listing" aria-labelledby="list-title">
    <div class="portfolio-section__inner">
      <header class="portfolio-section-heading">
        <a class="portfolio-back" href="{{ "/" | relURL }}">Portafolio</a>
        <p class="portfolio-kicker">Archivo</p>
        <h1 id="list-title">{{ .Title | default "Practicas" }}</h1>
      </header>

      <div class="portfolio-grid">
        {{ range sort .Pages "File.Dir" "asc" }}
          {{ partial "portfolio-card.html" . }}
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
